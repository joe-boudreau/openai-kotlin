jdk:
  - openjdk17

before_install:
  - apt-get update && apt-get install -y libcurl4-openssl-dev || sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev || echo "libcurl installation skipped"

install:
  - ./gradlew :openai-core:publishToMavenLocal :openai-client:publishToMavenLocal :openai-client-bom:publishToMavenLocal -Pgroup=$GROUP -Pversion=$VERSION -PRELEASE_SIGNING_ENABLED=false -xtest
